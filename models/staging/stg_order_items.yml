version: 2

models:
  - name: stg_order_items
    description: "Line-item level detail for every product in an order."
    columns:
      - name: order_item_key
        description: "Surrogate key: md5(order_id || line_item_number)"
        tests:
          - unique
          - not_null
      - name: order_id
      - name: line_item_number
        description: "Order of the item in the shopping cart."
      - name: product_id
        description: "Identifier for product."
        tests:
          - not_null
      - name: seller_id
        description: "Identifier for seller."
        tests:
          - not_null
      - name: seller_ship_before_at
      - name: item_price_amount
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">=0"
      - name: seller_ship_before_at
        description: "The deadline for the seller to ship the product (Merchant SLA)."
      - name: total_item_cost_amount
        description: "Total value per item (price + freight)."