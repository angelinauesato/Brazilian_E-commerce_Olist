version: 2

models:
  - name: stg_geolocation
    description: "Lat/Long coordinates for Brazilian zip codes."
    columns:
      - name: zip_code_prefix
        description: "The first 5 digits of the zip code."
        tests:
          - no_double_quotes
      - name: latitude
        tests:
          - not_null
          - no_double_quotes
      - name: longitude
        tests:
          - not_null
          - no_double_quotes
      - name: city
        tests:
          - no_double_quotes
      - name: state_code
        tests:
          - no_double_quotes